<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto Académico - Ingeniería de Sistemas</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#ffffff;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#0a192f;
color:white;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
}

/* MENU */
nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin:0 10px;
}

nav ul li a{
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:8px;
transition:0.3s;
}

nav ul li a:hover{
background:#64ffda;
color:#0a192f;
}

/* MENU MOVIL */
.menu-toggle{
display:none;
font-size:22px;
cursor:pointer;
}

/* HERO */
.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:linear-gradient(135deg,#0a192f,#112240);
color:white;
}

.hero img{
width:160px;
margin-bottom:20px;
}

.hero h1{
font-size:40px;
}

.hero p{
margin-top:10px;
opacity:0.8;
}

/* SECCIONES */
section{
padding:60px 20px;
max-width:1000px;
margin:auto;
transition:0.3s;
border-radius:10px;
}

section:hover{
background:#f0f4ff;
transform:scale(1.01);
}

h2{
margin-bottom:20px;
color:#0a192f;
}

/* ACORDEON */
.acordeon{
background:#0a192f;
color:white;
cursor:pointer;
padding:15px;
margin-top:10px;
border:none;
width:100%;
text-align:left;
font-size:16px;
border-radius:8px;
transition:0.3s;
display:flex;
justify-content:space-between;
}

.acordeon:hover{
background:#64ffda;
color:#0a192f;
}

.panel{
display:none;
padding:10px;
background:#f5f5f5;
border-radius:8px;
margin-bottom:10px;
}

iframe{
width:100%;
height:500px;
border:none;
}

/* BOTON ARRIBA */
#topBtn{
position:fixed;
bottom:20px;
right:20px;
background:#64ffda;
color:#0a192f;
border:none;
padding:10px 15px;
border-radius:50%;
cursor:pointer;
display:none;
font-size:18px;
}

/* FOOTER */
footer{
background:#0a192f;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

/* RESPONSIVE */
@media(max-width:768px){

.menu-toggle{
display:block;
}

nav ul{
flex-direction:column;
background:#0a192f;
position:absolute;
top:60px;
right:0;
width:200px;
display:none;
}

nav ul.show{
display:flex;
}

}
</style>
</head>

<body>

<header>
<div class="logo">AMS Systems</div>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<nav>
<ul id="menu">
<li><a href="#u1">Unidad 1</a></li>
<li><a href="#u2">Unidad 2</a></li>
<li><a href="#u3">Unidad 3</a></li>
<li><a href="#u4">Unidad 4</a></li>

</header>

<section class="hero">
<img src="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">
<h1>Proyecto Web Académico</h1>
<p>Ingeniería de Sistemas - 7mo ciclo</p>
</section>

<footer>
<p>© 2026 - Anderson Mayta | Ingeniería de Sistemas</p>
</footer>

<button id="topBtn" onclick="topFunction()">↑</button>

<script>
function toggleMenu(){
document.getElementById("menu").classList.toggle("show");
}

var acc = document.getElementsByClassName("acordeon");

for (let i = 0; i < acc.length; i++) {
acc[i].addEventListener("click", function() {
var panel = this.nextElementSibling;

if (panel.style.display === "block") {
panel.style.display = "none";
this.innerHTML = this.innerHTML.replace("⬆","⬇");
} else {
panel.style.display = "block";
this.innerHTML = this.innerHTML.replace("⬇","⬆");
}
});
}

window.onscroll = function() {
let btn = document.getElementById("topBtn");
if (document.documentElement.scrollTop > 200) {
btn.style.display = "block";
} else {
btn.style.display = "none";
}
};

function topFunction() {
document.documentElement.scrollTop = 0;
}
</script>

</body>
</html>
