<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS Systems — Ingeniería</title>

<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --surface: #1f2435;
  --accent: #c8f04a;
  --text: #e8eaf2;
  --text-muted: #7a8099;
  --border: rgba(255,255,255,0.08);
  --sidebar-w: 260px;
  --header-h: 60px;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: Arial, sans-serif;
}

/* HEADER */
.header {
  position:fixed;
  top:0; left:0; right:0;
  height:var(--header-h);
  background:#0d0f14;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  z-index:100;
}

/* SIDEBAR */
.sidebar {
  position:fixed;
  top:var(--header-h);
  left:0;
  bottom:0;
  width:var(--sidebar-w);
  background:var(--bg2);
  padding:20px;
}

.week-link {
  display:block;
  color:var(--text-muted);
  text-decoration:none;
  margin:6px 0;
  cursor:pointer;
}

.week-link:hover {
  color:var(--text);
}

/* MAIN */
.main {
  margin-left:var(--sidebar-w);
  padding-top:var(--header-h);
}

/* HERO */
.hero {
  padding:80px;
}

.hero h1 {
  font-size:42px;
}

/* UNITS */
.unit-section {
  display:none;
  padding:40px 60px;
}

.week-card {
  background:var(--surface);
  margin:10px 0;
  padding:20px;
  border-radius:10px;
  cursor:pointer;
}

.week-card-body {
  display:none;
  margin-top:15px;
}

.week-card.active .week-card-body {
  display:block;
}

/* BUTTON */
.back-btn {
  position:fixed;
  top:70px;
  right:20px;
  padding:8px 14px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  border-radius:6px;
  display:none;
}
</style>
</head>

<body>

<header class="header">
AMS SYSTEMS
</header>

<!-- SIDEBAR -->
<div class="sidebar">

<b>Unidad 1</b>
<a class="week-link" onclick="loadWeek('u1','s1')">Semana 1</a>
<a class="week-link" onclick="loadWeek('u1','s2')">Semana 2</a>

<b>Unidad 2</b>
<a class="week-link" onclick="loadWeek('u2','s5')">Semana 5</a>

<b>Unidad 3</b>
<a class="week-link" onclick="loadWeek('u3','s10')">Semana 10</a>

</div>

<!-- MAIN -->
<div class="main">

<!-- HERO -->
<section class="hero">
<h1>Portafolio Digital</h1>
<p>Selecciona una semana desde el menú</p>
</section>

<!-- UNIDAD 1 -->
<section id="u1" class="unit-section">
<h2>Unidad 1</h2>

<div id="s1" class="week-card" onclick="toggleWeek(this)">
Semana 1
<div class="week-card-body">
Contenido de semana 1 (Canva aquí)
</div>
</div>

<div id="s2" class="week-card" onclick="toggleWeek(this)">
Semana 2
<div class="week-card-body">
Contenido de semana 2
</div>
</div>

</section>

<!-- UNIDAD 2 -->
<section id="u2" class="unit-section">
<h2>Unidad 2</h2>

<div id="s5" class="week-card" onclick="toggleWeek(this)">
Semana 5
<div class="week-card-body">
Contenido semana 5
</div>
</div>

</section>

<!-- UNIDAD 3 -->
<section id="u3" class="unit-section">
<h2>Unidad 3</h2>

<div id="s10" class="week-card" onclick="toggleWeek(this)">
Semana 10
<div class="week-card-body">
Contenido semana 10
</div>
</div>

</section>

</div>

<button class="back-btn" onclick="goHome()">← Volver</button>

<script>
function loadWeek(unitId, weekId) {

  document.querySelector('.hero').style.display = 'none';
  document.querySelector('.back-btn').style.display = 'block';

  document.querySelectorAll('.unit-section').forEach(u => {
    u.style.display = 'none';
  });

  const unit = document.getElementById(unitId);
  unit.style.display = 'block';

  unit.querySelectorAll('.week-card').forEach(w => {
    w.classList.remove('active');
  });

  const week = document.getElementById(weekId);
  week.classList.add('active');

  setTimeout(()=>{
    week.scrollIntoView({behavior:'smooth'});
  },100);
}

function toggleWeek(card) {
  card.classList.toggle('active');
}

function goHome() {
  document.querySelector('.hero').style.display = 'block';
  document.querySelector('.back-btn').style.display = 'none';

  document.querySelectorAll('.unit-section').forEach(u => {
    u.style.display = 'none';
  });

  window.scrollTo({top:0, behavior:'smooth'});
}
</script>

</body>
</html>
